<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome – My Car Concierge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#12161c" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #12161c; --bg-card: rgba(26, 32, 42, 0.95); --bg-elevated: rgba(36, 44, 56, 0.95);
      --text-primary: #f5f5f7; --text-secondary: #a0a8b8; --text-muted: #6b7280;
      --accent-gold: #c9a227; --accent-teal: #2cc4b4; --border-subtle: rgba(160, 168, 184, 0.15);
      --radius-md: 12px; --radius-lg: 16px; --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 40px 32px; max-width: 460px; text-align: center; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border-subtle); border-top-color: var(--accent-gold); border-radius: 50%; margin: 0 auto 22px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .icon-big { font-size: 44px; margin-bottom: 16px; }
    h2 { font-family: 'Fraunces', serif; font-size: 24px; margin-bottom: 10px; }
    p { color: var(--text-secondary); font-size: 15px; line-height: 1.6; margin-bottom: 20px; }
    .btn { display: inline-block; background: var(--accent-gold); color: #12161c; padding: 13px 28px; border-radius: var(--radius-md); font-weight: 700; text-decoration: none; font-size: 15px; }
    .subdomain { color: var(--accent-teal); font-weight: 600; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <h2>Setting up your workspace…</h2>
    <p>This usually takes just a few seconds after payment. Hang tight.</p>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var applicationId = params.get('application_id');
    var card = document.getElementById('card');

    function renderProvisioned(app) {
      card.innerHTML = '<div class="icon-big">🎉</div>' +
        '<h2>You\'re all set!</h2>' +
        '<p>Your tenant workspace <span class="subdomain">' + app.subdomain + '.mycarconcierge.com</span> is live. Log in to your MCC account to manage your roster, branding, and settings from the tenant portal.</p>' +
        '<a class="btn" href="members.html">Go to My Portal</a>';
    }
    function renderFailed(app) {
      card.innerHTML = '<div class="icon-big">⚠️</div>' +
        '<h2>Payment received, setup needs a hand</h2>' +
        '<p>Your payment went through, but we hit a snag provisioning <strong>' + (app.subdomain || 'your workspace') + '</strong> automatically. Our team has been notified and will finish setting this up shortly -- no action needed from you.</p>';
    }
    function renderPending() {
      card.innerHTML = '<div class="spinner"></div><h2>Almost there…</h2><p>Your payment is confirmed and your workspace is being created. This page will update automatically -- feel free to leave it open, or check back in a minute.</p>';
    }
    function renderNoApplication() {
      card.innerHTML = '<div class="icon-big">✅</div><h2>Thanks for applying!</h2><p>We could not find your application reference, but if payment went through you\'ll receive access shortly. Log in to check your portal.</p><a class="btn" href="members.html">Go to My Portal</a>';
    }

    async function waitForClient() {
      var tries = 0;
      while (typeof window.supabaseClient === 'undefined' && tries < 50) { await new Promise(function(r) { setTimeout(r, 100); }); tries++; }
      return window.supabaseClient;
    }

    async function poll() {
      if (!applicationId) return renderNoApplication();
      var client = await waitForClient();
      var session = client ? (await client.auth.getSession()).data.session : null;
      var token = session ? session.access_token : null;
      if (!token) { renderPending(); return; }

      var attempts = 0;
      var maxAttempts = 20; // ~60s at 3s interval
      var interval = setInterval(async function() {
        attempts++;
        try {
          var res = await fetch('/api/white-label/apply?application_id=' + encodeURIComponent(applicationId), {
            headers: { 'Authorization': 'Bearer ' + token },
          });
          var data = await res.json();
          var app = data && data.application;
          if (app && app.status === 'provisioned') { clearInterval(interval); renderProvisioned(app); return; }
          if (app && app.status === 'failed') { clearInterval(interval); renderFailed(app); return; }
        } catch (e) { /* keep polling */ }
        if (attempts >= maxAttempts) { clearInterval(interval); renderPending(); }
      }, 3000);
    }
  </script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabaseclient.js"></script>
  <script>poll();</script>
</body>
</html>
